# Blueprint de Render. El repo es la raíz; la aplicación vive en reto-02-solucion/.
# Con rootDir definido, Render resuelve dockerfilePath y dockerContext RELATIVOS a rootDir.
services:
  - type: web
    name: agente-contratos-periferia
    runtime: docker
    plan: free
    rootDir: reto-02-solucion                       # solo cambios en esta carpeta disparan deploy
    dockerfilePath: ./Dockerfile                    # = reto-02-solucion/Dockerfile
    dockerContext: .                                # = reto-02-solucion/
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false            # se pide al crear el Blueprint; nunca va en el repo
      - key: APP_ACCESS_KEY
        sync: false            # clave que compartes con los evaluadores (chat y /mcp)
      - key: MAX_TOKENS_GLOBAL
        value: "2000000"
