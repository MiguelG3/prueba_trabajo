[project]
name = "reto-02-contratos"
version = "1.0.0"
description = "Agente conversacional de registro de contratos vigentes (Periferia IT · Reto 2) — Python + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "pypdf>=6.21.4",
    "langchain-google-genai>=4.4.2",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dev = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "modulo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
